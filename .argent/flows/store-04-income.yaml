steps:
  - echo: Relaunch (state carries over from earlier scenes) and start a salary in the payment composer.
  - launch: software.felipe.everysecondpays
  - await: { visible: { id: period-button }, timeout: 15000 }
  - await: { idle: true }
  - tap: { id: new-source-tab }
  - await: { visible: { text: New payment source }, timeout: 10000 }
  - await: { idle: true }
  - type:
      into: { text: Company or client }
      text: Design Studio
      submit: false
  - tap: { text: $0 }
  - type:
      into: { role: TextField, text: "0" }
      text: "6500"
      submit: false
  - echo: Open the pay period picker with its six ways to get paid.
  - tap: { text: per month }
  - await: { visible: { text: One-time }, timeout: 10000 }
  - await: { idle: true }
