steps:
  - script: { path: ../../goldie/bin/clock-off-shift.mjs }
  - echo: Goldie installs once per capture, so this runs after store-01-today seeded
      the sources. Relaunch on the dashboard and open the widget editor from Settings.
  - launch: software.felipe.everysecondpays
  - await: { visible: { id: period-button }, timeout: 25000 }
  - await: { idle: true }
  - tap: { id: settings-tab }
  - await: { visible: { id: settings-widgets }, timeout: 15000 }
  - tap: { id: settings-widgets }
  - await: { visible: { id: widgets-add }, timeout: 15000 }
  - await: { idle: true }

  - echo: The hero layout with the wildest money rain.
  - tap: { id: widget-template-hero }
  - tap: { id: widget-group-motion }
  - await: { idle: true }
  - scroll-to: { target: { text: { matches: '^(Wild|Frenético|Déchaîné)$' } } }
  - tap: { text: { matches: '^(Wild|Frenético|Déchaîné)$' } }
  - scroll-to: { target: { id: widgets-add } }
  - await: { idle: true }

  - tap: { id: widgets-add }
  - echo: The Pixel launcher's pin dialog, whose wording differs from the app's, so tap the button after Cancel.
      Jump into both shifts before confirming, so the widget counts live from its first frame.
  - await: { visible: { text: { matches: '^(Cancel|Cancelar|Annuler)$' } }, timeout: 15000 }
  - script: { path: ../../goldie/bin/clock-on-shift.mjs }
  - wait: 1500
  - tap: { role: button, next: { text: { matches: '^(Cancel|Cancelar|Annuler)$' } } }
  - wait: 2500

  - echo: Go home, where the live widget now counts up on the launcher.
  - tool: button
    args: { button: home }
  - wait: 7000
