steps:
  - script: { path: ../../goldie/bin/clock-off-shift.mjs }
  - echo: Relaunch (state carries over from earlier scenes) and open the widget editor from Settings.
  - launch: software.felipe.everysecondpays
  - await: { visible: { id: period-button }, timeout: 25000 }
  - await: { idle: true }
  - tap: { id: settings-tab }
  - await: { visible: { id: settings-widgets }, timeout: 15000 }
  - tap: { id: settings-widgets }
  - await: { visible: { id: widgets-add }, timeout: 15000 }
  - await: { idle: true }

  - echo: The large preview above its money flow and number motion choices.
  - echo: French calls the wide size Large, so pick the size that comes after it.
  - tap: { text: { matches: '^(Large|Grande|Grand)$' }, after: { text: { matches: '^(Wide|Largo|Ancho|Large)$' } } }
  - await: { idle: true }
  - tap: { id: widget-group-motion }
  - await: { idle: true }
  - scroll-to: { target: { text: { matches: '^(Energy|Energia|Energía|Énergie)$' } } }
  - await: { idle: true }

  - echo: Jump into both shifts so the preview counts and rains. The app only republishes
      the schedule when it returns to the foreground, so leave and come back.
  - script: { path: ../../goldie/bin/still-numbers.mjs }
  - script: { path: ../../goldie/bin/clock-on-shift.mjs }
  - tool: button
    args: { button: home }
  - wait: 1500
  - script: { path: ../../goldie/bin/resume-app.mjs }
  - wait: 8000
