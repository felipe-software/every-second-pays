steps:
  - script: { path: ../../goldie/bin/clock-off-shift.mjs }
  - echo: Relaunch (state carries over from earlier scenes) and start a salary in the payment composer.
  - launch: software.felipe.everysecondpays
  - await: { visible: { id: period-button }, timeout: 25000 }
  - await: { idle: true }
  - run: store-show-earnings
  - tap: { id: new-source-tab }
  - await: { visible: { id: save-source }, timeout: 15000 }
  - await: { idle: true }
  - type:
      into: { role: TextField }
      text: Studio Nova
      submit: false
  - await: { idle: true }
  - tap: { text: { matches: '0, [^,]+$' } }
  - await: { visible: { role: TextField, text: "0" }, timeout: 10000 }
  - type:
      into: { role: TextField, text: "0" }
      text: "6500"
      submit: false
  - await: { idle: true }
  - echo: Open the 24-hour day dial from the start time.
  - echo: The label is 9:00 AM in English and 09:00 or 9:00 elsewhere, with a narrow no-break space before AM.
  - tap: { text: { matches: '^0?9:00(\sAM)?$' } }
  - await: { visible: { text: { matches: '^(Presets|Modelos|Plantillas|Modèles)$' } }, timeout: 15000 }
  - await: { idle: true }
