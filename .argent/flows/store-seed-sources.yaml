executionPrerequisite: A fresh install on the empty earnings dashboard.
steps:
  - echo: Add a monthly salary on the default Mon–Fri, 9 AM–5 PM schedule.
  - tap: { id: new-source-tab }
  - await: { visible: { text: New payment source }, timeout: 10000 }
  - await: { idle: true }
  - type:
      into: { text: Company or client }
      text: Design Studio
      submit: false
  - await: { idle: true }
  - tap: { text: "$0, required" }
  - await: { visible: { role: TextField, text: "0" }, timeout: 10000 }
  - type:
      into: { role: TextField, text: "0" }
      text: "6500"
      submit: false
  - await: { idle: true }
  - tap: { id: save-source }
  - await: { hidden: { text: New payment source }, timeout: 10000 }
  - await: { visible: { text: Design Studio } }

  - echo: Add a morning hourly gig with the Mornings preset on the day dial.
  - tap: { id: new-source-tab }
  - await: { visible: { text: New payment source }, timeout: 10000 }
  - await: { idle: true }
  - type:
      into: { text: Company or client }
      text: Tutoring
      submit: false
  - await: { idle: true }
  - tap: { text: "$0, required" }
  - await: { visible: { role: TextField, text: "0" }, timeout: 10000 }
  - type:
      into: { role: TextField, text: "0" }
      text: "45"
      submit: false
  - await: { idle: true }
  - tap: { text: per month }
  - tap: { text: Hour }
  - echo: The time label uses a narrow no-break space, so match any space.
  - tap: { text: { matches: '^9:00\sAM$' } }
  - await: { visible: { text: Mornings } }
  - tap: { text: Mornings }
  - tap: { id: save-source }
  - await: { hidden: { text: New payment source }, timeout: 10000 }
  - await: { visible: { text: Tutoring } }

  - echo: Add a one-time project payment that landed today.
  - tap: { id: new-source-tab }
  - await: { visible: { text: New payment source }, timeout: 10000 }
  - await: { idle: true }
  - type:
      into: { text: Company or client }
      text: Acme
      submit: false
  - await: { idle: true }
  - tap: { text: "$0, required" }
  - await: { visible: { role: TextField, text: "0" }, timeout: 10000 }
  - type:
      into: { role: TextField, text: "0" }
      text: "1200"
      submit: false
  - await: { idle: true }
  - tap: { text: per month }
  - tap: { text: One-time }
  - tap: { id: save-source }
  - await: { hidden: { text: New payment source }, timeout: 10000 }
  - await: { visible: { text: Acme } }
