executionPrerequisite: A fresh install on the onboarding, which goldie's warm-up leaves running.
steps:
  - echo: Hold the clock before every shift so the screen stays still while the flow reads it.
  - script: { path: ../../goldie/bin/clock-off-shift.mjs }
  - echo: A launch step here outlasts its budget, and the intro animates too hard for tree reads. So give the intro
      time to accept taps, then tap Skip by its coordinates on the 1080x2400 Pixel 8 capture AVD.
  - wait: 20000
  - tool: gesture-tap
    args: { x: 0.898, y: 0.083 }
  - wait: 4000
  - echo: From here launches are quick.
  - launch: software.felipe.everysecondpays
  - await: { visible: { text: No payment sources yet }, timeout: 25000 }
  - await: { idle: true }
  - run: store-seed-sources
  - await: { visible: { id: period-button }, timeout: 25000 }
  - launch: software.felipe.everysecondpays
  - await: { visible: { id: period-button }, timeout: 25000 }
  - await: { idle: true }
  - run: store-show-earnings
  - echo: Jump into both shifts so the dashboard counts live, with the digits still instead of caught mid-roll.
  - script: { path: ../../goldie/bin/still-numbers.mjs }
  - script: { path: ../../goldie/bin/clock-on-shift.mjs }
  - wait: 6000
