steps:
  - echo: Relaunch (state carries over from earlier scenes) and open personalization settings.
  - launch: software.felipe.everysecondpays
  - await: { visible: { id: period-button }, timeout: 15000 }
  - await: { idle: true }
  - tap: { id: settings-tab }
  - await: { visible: { text: Accent color }, timeout: 10000 }
  - await: { idle: true }
  - echo: Switch to the dark theme with the Ocean accent.
  - tap: { id: theme-dark }
  - wait: 1500
  - tap: { id: palette-blue }
  - wait: 1500
  - await: { idle: true }
