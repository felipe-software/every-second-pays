plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.notificationmotion'
version = '0.1.0'
android {
  namespace 'expo.modules.notificationmotion'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

abstract class GenerateNotiSources extends DefaultTask {
  @InputFiles
  @PathSensitive(PathSensitivity.RELATIVE)
  abstract ConfigurableFileCollection getGenerators()

  @Internal
  abstract DirectoryProperty getModuleDirectory()

  @OutputDirectory
  abstract DirectoryProperty getResDirectory()

  @OutputDirectory
  abstract DirectoryProperty getKotlinDirectory()

  @Inject
  abstract ExecOperations getExecOperations()

  @Inject
  abstract FileSystemOperations getFileSystemOperations()

  @TaskAction
  void generate() {
    def res = resDirectory.get().asFile
    def kotlin = kotlinDirectory.get().asFile
    // Start empty, so a renamed resource doesn't leave the old one behind.
    fileSystemOperations.delete { delete(res, kotlin) }
    def scripts = moduleDirectory.dir('scripts').get().asFile
    execOperations.exec { commandLine 'node', new File(scripts, 'generate-base-resources.cjs').path, res.path }
    execOperations.exec { commandLine 'node', new File(scripts, 'generate-money-widget-resources.mjs').path, res.path, kotlin.path }
  }
}

def generateNotiSources = tasks.register('generateNotiSources', GenerateNotiSources) {
  moduleDirectory = layout.projectDirectory.dir('..')
  generators.from('../scripts', '../plugin/compiler.js')
  resDirectory = layout.buildDirectory.dir('generated/noti/res')
  kotlinDirectory = layout.buildDirectory.dir('generated/noti/kotlin')
}

androidComponents {
  onVariants(selector().all()) { variant ->
    variant.sources.res.addGeneratedSourceDirectory(generateNotiSources) { it.resDirectory }
    // Kotlin compiles the generated Java source directories too; it skips generated `kotlin` ones.
    variant.sources.java.addGeneratedSourceDirectory(generateNotiSources) { it.kotlinDirectory }
  }
}
