name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: EAS build profile
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
      ref:
        description: Branch or tag to build (release has the bumped version)
        required: true
        default: release
        type: string
      submit:
        description: Submit to the stores when the build finishes (production only)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start EAS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail

          args=()
          if [ "${{ inputs.submit }}" = "true" ]; then
            if [ "${{ inputs.profile }}" != "production" ]; then
              echo "::error::Store submission is only available for the production profile."
              exit 1
            fi
            args+=(--auto-submit)
          fi

          version=$(bun pm pkg get version | tr -d '"')
          echo "Building **v${version}** (${{ inputs.platform }}, ${{ inputs.profile }}, submit: ${{ inputs.submit }}) from \`${{ inputs.ref }}\`." >> "$GITHUB_STEP_SUMMARY"

          bunx eas-cli@latest build \
            --platform "${{ inputs.platform }}" \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --no-wait \
            "${args[@]}"
