name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # oxlint runs its JS plugins on Node, and RuleTester doesn't support Bun.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx oxlint --type-aware --deny-warnings

      - name: Lint with Expo rules
        run: bunx expo lint

      - name: Check the legacy list only shrinks
        run: bun tools/oxlint/legacy-check.mts

      - name: Check anti-slop matches upstream
        run: bun tools/oxlint/sync-anti-slop.mts --check

      - name: Test the comment rule
        run: node --test tools/oxlint/comment-policy/*.test.ts

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test src/tests

      - name: Check formatting of changed files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR -z "${BASE_SHA}...HEAD" \
            | xargs -0 -r bunx oxfmt --check --no-error-on-unmatched-pattern

      - name: Audit changed code
        if: github.event_name == 'pull_request'
        run: bunx fallow audit --base "origin/${{ github.base_ref }}"

      - name: React Doctor on changed code
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: bunx react-doctor --scope changed --base "origin/${{ github.base_ref }}" --blocking none

      - name: Expo Doctor
        continue-on-error: true
        run: bunx expo-doctor
